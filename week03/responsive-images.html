<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Responsive Images</title>
    <meta name="author" content="Benjamin Daniel Heredia Urbinatti">

<body>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="./images/hero-large.webp">
                <source media="(min-width: 600px)" srcset="./images/hero-medium.webp">
                <img src="./images/hero-small.webp" alt="Córdoba Argentina Temple" width="500" height="250">
            </picture>
        </div>
    </main>
    
</body>
