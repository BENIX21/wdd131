<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Product review form to rate and share feedback on purchased items.">
    <meta name="author" content="Benjamin Daniel Heredia Urbinatti">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">

            <div class="form-group">
                <label for="productName">Product Name <span class="required-mark">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group rating-fieldset">
                <legend>Overall Rating <span class="required-mark">*</span></legend>
                <div class="rating-container">
                    <div class="rating-item">
                        <label for="rating1">&star;</label>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </div>
                    <div class="rating-item">
                        <label for="rating2">&star;&star;</label>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </div>
                    <div class="rating-item">
                        <label for="rating3">&star;&star;&star;</label>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </div>
                    <div class="rating-item">
                        <label for="rating4">&star;&star;&star;&star;</label>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </div>
                    <div class="rating-item">
                        <label for="rating5">&star;&star;&star;&star;&star;</label>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required-mark">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group checkbox-fieldset">
                <legend>Which features did you find useful in the product? <span class="sub-hint">(Check all that
                        apply)</span></legend>
                <div class="checkbox-list">
                    <label for="durability" class="checkbox-label">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>
                    <label for="easeOfUse" class="checkbox-label">
                        <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                        Ease of Use
                    </label>
                    <label for="performance" class="checkbox-label">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>
                    <label for="design" class="checkbox-label">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>
            <div class="form-group">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> ☀️ Benjamin Heredia ☀️ Cordoba, Argentina 🧉</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
